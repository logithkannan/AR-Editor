<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Feel AR — Scanner</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  
  <script>
    // Chroma Key Shader Component
    AFRAME.registerComponent('chromakey-video', {
      schema: {
        src: { type: 'selector' },
        threshold: { type: 'number', default: 0.25 },
        color: { type: 'color', default: '#00FF00' },
        enabled: { type: 'boolean', default: true }
      },
      init: function () {
        const video = this.data.src;
        if (!video) return;

        const texture = new THREE.VideoTexture(video);
        texture.minFilter = THREE.LinearFilter;
        
        // Custom Shader to remove green
        this.material = new THREE.ShaderMaterial({
          transparent: true,
          uniforms: {
            tex: { value: texture },
            keyColor: { value: new THREE.Color(this.data.color) },
            threshold: { value: this.data.threshold }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tex;
            uniform vec3 keyColor;
            uniform float threshold;
            varying vec2 vUv;
            void main() {
              vec4 col = texture2D(tex, vUv);
              float diff = distance(col.rgb, keyColor);
              if (diff < threshold) {
                discard;
              } else {
                gl_FragColor = col;
              }
            }
          `
        });

        this.el.getObject3D('mesh').material = this.material;
        
        // Ensure video plays
        video.play().catch(() => {
          document.body.addEventListener('click', () => video.play(), { once: true });
        });
      },
      update: function() {
        if (this.material) {
          this.material.uniforms.threshold.value = this.data.threshold;
        }
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
    #ui { position: fixed; inset: 0; z-index: 100; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 20px; }
    #status { color: #fff; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px; font-size: 12px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); }
    .scan-overlay { position: absolute; width: 70vw; height: 50vh; border: 2px solid rgba(99, 202, 255, 0.5); border-radius: 20px; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 1000px rgba(0,0,0,0.4); }
  </style>
</head>
<body>

  <div id="ui">
    <div id="status">Initializing Camera...</div>
    <div class="scan-overlay"></div>
    <div id="status">Aim at the trigger image</div>
  </div>

  <a-scene id="scene" embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets id="assets-container"></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target-container"></a-entity>
  </a-scene>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('project');

    async function initScanner() {
      if (!projectId) {
        document.getElementById('status').innerText = "No Project ID found.";
        return;
      }

      try {
        // 1. Fetch project data from your GitHub data repository
        const response = await fetch(`https://raw.githubusercontent.com/logithkannan/feel-ar-data/main/projects/${projectId}.json`);
        const project = await response.json();

        const assetsContainer = document.getElementById('assets-container');
        const targetContainer = document.getElementById('target-container');
        const statusEl = document.getElementById('status');

        // 2. Set MindAR source
        document.getElementById('scene').setAttribute('mindar-image', `imageTargetSrc: ${project.mindFileUrl}; autoStart: true;`);

        // 3. Create Scene Elements
        let assetsHTML = '';
        let entitiesHTML = '';

        project.layers.forEach((layer, index) => {
          const id = `layer-${index}`;
          
          // Calculate scale (normalized to MindAR space)
          const scaleW = layer.width / 500;
          const scaleH = layer.height / 500;
          const posX = (layer.x - 250 + layer.width / 2) / 500;
          const posY = -(layer.y - 180 + layer.height / 2) / 500;
          const rotZ = -(layer.rotation || 0);

          if (layer.type === "image") {
            assetsHTML += `<img id="${id}-src" src="${layer.url}" crossorigin="anonymous">`;
            entitiesHTML += `<a-image id="${id}" src="#${id}-src" width="${scaleW}" height="${scaleH}" position="${posX} ${posY} 0.01" rotation="0 0 ${rotZ}" opacity="${layer.opacity || 1}" visible="false"></a-image>`;
          } 
          
          else if (layer.type === "video") {
            assetsHTML += `<video id="${id}-src" src="${layer.url}" loop="true" muted="true" playsinline crossorigin="anonymous" webkit-playsinline preload="auto"></video>`;
            
            // NEW: Use the Editor's isGreenScreen property and Threshold
            const isChroma = layer.isGreenScreen === true || layer.url.toLowerCase().includes('green');
            const threshold = layer.chromaThreshold || 0.25;

            if (isChroma) {
              entitiesHTML += `<a-plane id="${id}" width="${scaleW}" height="${scaleH}" position="${posX} ${posY} 0.01" rotation="0 0 ${rotZ}" chromakey-video="src: #${id}-src; threshold: ${threshold}" visible="false"></a-plane>`;
            } else {
              entitiesHTML += `<a-video id="${id}" src="#${id}-src" width="${scaleW}" height="${scaleH}" position="${posX} ${posY} 0.01" rotation="0 0 ${rotZ}" material="shader: flat; transparent: true; opacity: ${layer.opacity || 1}" visible="false"></a-video>`;
            }
          } 
          
          else if (layer.type === "text") {
            entitiesHTML += `<a-entity id="${id}" position="${posX} ${posY} 0.01" rotation="0 0 ${rotZ}" text="value: ${layer.content}; align: center; width: ${scaleW * 2}; color: white" visible="false"></a-entity>`;
          }
        });

        assetsContainer.innerHTML = assetsHTML;
        
        const targetEntity = document.createElement('a-entity');
        targetEntity.setAttribute('mindar-image-target', 'targetIndex: 0');
        targetEntity.innerHTML = entitiesHTML;
        targetContainer.appendChild(targetEntity);

        // 4. Handle Tracking Events
        targetEntity.addEventListener("targetFound", () => {
          statusEl.innerText = "Target Found";
          project.layers.forEach((_, i) => {
            const el = document.getElementById(`layer-${i}`);
            el.setAttribute('visible', true);
            const video = document.getElementById(`layer-${i}-src`);
            if (video && video.tagName === 'VIDEO') video.play();
          });
        });

        targetEntity.addEventListener("targetLost", () => {
          statusEl.innerText = "Target Lost";
          project.layers.forEach((_, i) => {
            const el = document.getElementById(`layer-${i}`);
            el.setAttribute('visible', false);
            const video = document.getElementById(`layer-${i}-src`);
            if (video && video.tagName === 'VIDEO') video.pause();
          });
        });

        document.querySelector('a-scene').addEventListener('arReady', () => {
          statusEl.innerText = "Scanner Ready";
        });

      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = "Error loading project.";
      }
    }

    window.onload = initScanner;
  </script>
</body>
</html>
