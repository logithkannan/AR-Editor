<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Feel AR — Scanner</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent !important; font-family: 'Outfit', sans-serif; color: white; }

    #scan-line {
      position: fixed; top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(to bottom, transparent, #63caff, transparent);
      box-shadow: 0 0 15px #63caff; z-index: 15;
      animation: scan 3s ease-in-out infinite; opacity: 0.6;
    }
    @keyframes scan { 0% { top: 15%; } 50% { top: 85%; } 100% { top: 15%; } }

    #viewfinder-layer { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .corner { position: absolute; width: 36px; height: 36px; border-color: rgba(255,255,255,0.3); border-style: solid; border-width: 0; transition: all 0.3s ease; }
    .corner-tl { top: 28px; left: 28px; border-top-width: 2px; border-left-width: 2px; }
    .corner-tr { top: 28px; right: 28px; border-top-width: 2px; border-right-width: 2px; }
    .corner-bl { bottom: 28px; left: 28px; border-bottom-width: 2px; border-left-width: 2px; }
    .corner-br { bottom: 28px; right: 28px; border-bottom-width: 2px; border-right-width: 2px; }
    .viewfinder-active .corner { border-color: #63caff; box-shadow: 0 0 15px rgba(99,202,255,0.5); }

    #scene-container { position: fixed; inset: 0; z-index: 1; }
    a-scene { width: 100% !important; height: 100% !important; }

    #loading-screen {
      position: fixed; inset: 0; background: #07070e;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; z-index: 100; text-align: center; padding: 24px;
    }
    .logo { font-size: 24px; font-weight: 700; color: #63caff; }
    .spinner { width: 48px; height: 48px; border: 3px solid rgba(99,202,255,0.15); border-top-color: #63caff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-status { font-size: 13px; color: rgba(255,255,255,0.45); font-weight: 300; }

    #error-screen {
      position: fixed; inset: 0; background: #07070e;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; z-index: 100; text-align: center; padding: 28px;
    }
    .err-icon { font-size: 52px; }
    .err-title { font-size: 20px; font-weight: 700; color: #f87171; }
    .err-msg { font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.8; max-width: 300px; }
    .retry-btn { background: #63caff; color: #07070e; border: none; padding: 12px 28px; border-radius: 30px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Outfit', sans-serif; }

    #instruction-container {
      position: fixed; bottom: 50px; width: 100%; display: flex; justify-content: center;
      pointer-events: none; z-index: 20; transition: opacity 0.3s ease;
    }
    .instruction-pill {
      background: rgba(15,15,15,0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1); padding: 12px 24px; border-radius: 50px;
      display: flex; align-items: center; gap: 10px;
    }
    .instruction-text { font-weight: 500; font-size: 1rem; }

    #target-indicator {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      z-index: 20; display: none;
      background: rgba(15,15,15,0.7); backdrop-filter: blur(12px);
      border: 1px solid rgba(99,202,255,0.25); border-radius: 30px;
      padding: 8px 18px; font-size: 12px; font-weight: 600; color: #63caff;
      gap: 8px; align-items: center;
    }
    .ti-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; }

    #unmute-btn {
      position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
      z-index: 500; background: #63caff; color: #000;
      border-radius: 50px; padding: 14px 28px; display: none;
      cursor: pointer; border: none; font-family: inherit; font-weight: 700;
      box-shadow: 0 0 20px rgba(99,202,255,0.6);
    }

    /* FULLSCREEN OVERLAY STYLES */
    #fs-overlay {
      position: fixed; inset: 0; background: #000; z-index: 9999;
      display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    #fs-video { width: 100%; max-height: 100%; outline: none; }
    #close-fs {
      position: absolute; top: 30px; right: 30px; background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 50%;
      width: 44px; height: 44px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

<div id="scan-line"></div>

<div id="loading-screen">
  <div class="logo">◈ Feel AR</div>
  <div class="spinner"></div>
  <div class="load-status" id="load-status">Loading project...</div>
</div>

<div id="error-screen">
  <div class="err-icon">⚠️</div>
  <div class="err-title">Something went wrong</div>
  <div class="err-msg" id="error-msg">Unknown error</div>
  <button class="retry-btn" onclick="location.reload()">Try Again</button>
</div>

<div id="fs-overlay">
  <video id="fs-video" controls playsinline></video>
  <button id="close-fs">✕</button>
</div>

<div id="viewfinder-layer">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
</div>

<div id="target-indicator">
  <div class="ti-dot"></div>
  <span id="target-indicator-text">Target found</span>
</div>

<div id="instruction-container">
  <div class="instruction-pill">
    <span class="instruction-text" id="instruction-text">Point camera at the image</span>
  </div>
</div>

<button id="unmute-btn">🔊 Click to Enable Sound</button>

<div id="video-sources" style="display:none"></div>
<div id="scene-container"></div>

<script>
const GITHUB_USER = "logithkannan";
const GITHUB_REPO = "feel-ar-data";
const rawUrl = (path) => `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${path}?t=${Date.now()}`;
const projectId = new URLSearchParams(window.location.search).get("project");

let audioUnlocked = false;
let activeTargetCount = 0; 

const fsOverlay = document.getElementById("fs-overlay");
const fsVideo = document.getElementById("fs-video");
const closeFs = document.getElementById("close-fs");

function setStatus(msg) { document.getElementById("load-status").textContent = msg; }
function showError(msg) {
  document.getElementById("loading-screen").style.display = "none";
  document.getElementById("error-screen").style.display = "flex";
  document.getElementById("error-msg").textContent = msg;
}

const unmuteBtn = document.getElementById("unmute-btn");
unmuteBtn.addEventListener("click", () => {
  audioUnlocked = true;
  document.querySelectorAll("video").forEach(v => { v.muted = false; v.play().catch(() => {}); });
  unmuteBtn.style.display = "none";
});

// Fullscreen Control
closeFs.onclick = () => {
  fsVideo.pause();
  fsOverlay.style.display = "none";
  document.querySelector("a-scene").play(); // Resume AR
};

window.openFullscreen = (videoId) => {
  const arVideo = document.getElementById(videoId);
  if (!arVideo) return;
  
  document.querySelector("a-scene").pause(); // Pause AR for performance
  fsVideo.src = arVideo.src;
  fsVideo.currentTime = arVideo.currentTime; // Sync time
  fsOverlay.style.display = "flex";
  fsVideo.play();
};

async function init() {
  if (!projectId) { showError("No project ID in URL."); return; }
  setStatus("Loading project...");
  let project;
  try {
    const res = await fetch(rawUrl(`projects/${projectId}.json`));
    if (!res.ok) throw new Error(`Project not found (${res.status})`);
    project = await res.json();
  } catch(e) { showError(e.message); return; }

  if (!project.mindFileUrl) { showError("No AR target compiled yet."); return; }

  const buildFunc = project.type === "multi" ? buildMultiScene : buildSingleScene;
  buildFunc(project);
}

// ── SINGLE TARGET ─────────────────────────────────────────────────────────
function buildSingleScene(project) {
  const { assetsHTML, entitiesHTML } = buildTargetHTML(project.layers, 0);

  document.getElementById("scene-container").innerHTML = `
    <a-scene
      mindar-image="imageTargetSrc: ${project.mindFileUrl}; uiScanning: no; uiLoading: no;"
      vr-mode-ui="enabled: false"
      renderer="colorManagement: true; alpha: true;">
      <a-assets timeout="15000">${assetsHTML}</a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false">
        <a-cursor fuse="false" raycaster="objects: .clickable"></a-cursor>
      </a-camera>
      <a-entity mindar-image-target="targetIndex: 0" id="ar-target-0">
        ${entitiesHTML}
      </a-entity>
    </a-scene>`;

  setupEvents(project.layers, 0);
}

// ── MULTI TARGET ──────────────────────────────────────────────────────────
function buildMultiScene(project) {
  let allAssetsHTML = "";
  let allEntitiesHTML = "";

  project.targets.forEach((target, idx) => {
    const { assetsHTML, entitiesHTML } = buildTargetHTML(target.layers, idx);
    allAssetsHTML += assetsHTML;
    allEntitiesHTML += `<a-entity mindar-image-target="targetIndex: ${idx}" id="ar-target-${idx}">${entitiesHTML}</a-entity>`;
  });

  document.getElementById("scene-container").innerHTML = `
    <a-scene
      mindar-image="imageTargetSrc: ${project.mindFileUrl}; uiScanning: no; uiLoading: no;"
      vr-mode-ui="enabled: false"
      renderer="colorManagement: true; alpha: true;">
      <a-assets timeout="15000">${allAssetsHTML}</a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false">
        <a-cursor fuse="false" raycaster="objects: .clickable"></a-cursor>
      </a-camera>
      ${allEntitiesHTML}
    </a-scene>`;

  project.targets.forEach((target, idx) => {
    setupEvents(target.layers, idx, target.name);
  });
}

function setupEvents(layers, idx, targetName = null) {
  const scene = document.querySelector("a-scene");
  const arTarget = document.getElementById(`ar-target-${idx}`);
  const viewfinder = document.getElementById("viewfinder-layer");
  const scanLine = document.getElementById("scan-line");
  const instruction = document.getElementById("instruction-container");
  const indicator = document.getElementById("target-indicator");
  const indicatorText = document.getElementById("target-indicator-text");

  scene.addEventListener("renderstart", () => {
    setTimeout(() => { document.getElementById("loading-screen").style.display = "none"; }, 500);
  });

  arTarget.addEventListener("targetFound", () => {
    activeTargetCount++;
    scanLine.style.display = "none";
    viewfinder.classList.add("viewfinder-active");
    instruction.style.opacity = "0";

    if (targetName) {
        indicatorText.textContent = targetName;
        indicator.style.display = "flex";
    }

    showLayers(layers, idx);
    playVideos(layers, idx);
  });

  arTarget.addEventListener("targetLost", () => {
    activeTargetCount = Math.max(0, activeTargetCount - 1);
    hideLayers(layers, idx);
    pauseVideos(layers, idx);

    if (activeTargetCount === 0) {
      scanLine.style.display = "block";
      viewfinder.classList.remove("viewfinder-active");
      instruction.style.opacity = "1";
      indicator.style.display = "none";
    }
  });
}

// ── HELPERS ───────────────────────────────────────────────────────────────
const W = 500, H = 360;

function buildTargetHTML(layers, targetIdx) {
  let assetsHTML = "";
  let entitiesHTML = "";

  (layers || []).forEach((layer, i) => {
    const id = `t${targetIdx}-layer-${i}`;
    const scaleW = (layer.width / W).toFixed(3);
    const scaleH = (layer.height / H).toFixed(3);
    const posX   = (((layer.x + layer.width  / 2) - W / 2) / W).toFixed(3);
    const posY   = (-((layer.y + layer.height / 2) - H / 2) / H).toFixed(3);
    const rotZ   = (-(layer.rotation || 0)).toFixed(1);
    const opac   = (layer.opacity ?? 1).toFixed(2);

    if (layer.type === "video") {
      assetsHTML += `<video id="${id}-src" src="${layer.url}" loop muted playsinline webkit-playsinline crossorigin="anonymous" preload="auto"></video>`;
      entitiesHTML += `<a-video id="${id}" class="clickable" src="#${id}-src" width="${scaleW}" height="${scaleH}" position="${posX} ${posY} 0.001" rotation="0 0 ${rotZ}" 
                        material="opacity:${opac};transparent:true;shader:flat;src:#${id}-src" 
                        onclick="openFullscreen('${id}-src')"
                        visible="false"></a-video>`;
    } else if (layer.type === "image") {
      assetsHTML += `<img id="${id}-src" src="${layer.url}" crossorigin="anonymous" />`;
      entitiesHTML += `<a-image id="${id}" src="#${id}-src" width="${scaleW}" height="${scaleH}" position="${posX} ${posY} 0.001" rotation="0 0 ${rotZ}" material="opacity:${opac};transparent:true;shader:flat;src:#${id}-src" visible="false"></a-image>`;
    } else if (layer.type === "text") {
      const textWidth = ((layer.width / W) * 2).toFixed(3);
      const escaped = (layer.content || "").replace(/"/g, "&quot;");
      entitiesHTML += `<a-text id="${id}" value="${escaped}" align="center" color="white" width="${textWidth}" position="${posX} ${posY} 0.001" opacity="${opac}" visible="false"></a-text>`;
    }
  });

  return { assetsHTML, entitiesHTML };
}

function showLayers(layers, targetIdx) {
  (layers || []).forEach((_, i) => {
    const el = document.getElementById(`t${targetIdx}-layer-${i}`);
    if (el) el.setAttribute("visible", true);
  });
}

function hideLayers(layers, targetIdx) {
  (layers || []).forEach((_, i) => {
    const el = document.getElementById(`t${targetIdx}-layer-${i}`);
    if (el) el.setAttribute("visible", false);
  });
}

function playVideos(layers, targetIdx) {
  (layers || []).forEach((layer, i) => {
    if (layer.type !== "video") return;
    const v = document.getElementById(`t${targetIdx}-layer-${i}-src`);
    if (!v) return;
    v.muted = !audioUnlocked;
    v.play().then(() => { if (!audioUnlocked) unmuteBtn.style.display = "block"; })
      .catch(() => { unmuteBtn.style.display = "block"; });
  });
}

function pauseVideos(layers, targetIdx) {
  (layers || []).forEach((layer, i) => {
    if (layer.type !== "video") return;
    const v = document.getElementById(`t${targetIdx}-layer-${i}-src`);
    if (v) { v.pause(); v.currentTime = 0; }
  });
}

// iOS DeviceOrientation permission
if (typeof DeviceOrientationEvent?.requestPermission === "function") {
  const req = () => {
    DeviceOrientationEvent.requestPermission()
      .then(r => { if (r === "granted") window.addEventListener("deviceorientation", () => {}); })
      .catch(console.error);
    document.removeEventListener("touchend", req);
  };
  document.addEventListener("touchend", req);
}

init();
</script>
</body>
</html>
