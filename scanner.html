<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Feel AR — Scanner & Recorder</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body { 
      width: 100%; height: 100%; overflow: hidden; 
      background: transparent !important; 
      font-family: 'Outfit', sans-serif; color: white; 
    }

    /* Scanning line */
    #scan-line {
      position: fixed; top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(to bottom, transparent, #63caff, transparent);
      box-shadow: 0 0 15px #63caff; z-index: 15;
      animation: scan 3s ease-in-out infinite; opacity: 0.6;
    }
    @keyframes scan { 0% { top: 15%; } 50% { top: 85%; } 100% { top: 15%; } }

    #viewfinder-layer { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .corner { position: absolute; width: 36px; height: 36px; border-color: rgba(255,255,255,0.3); border-style: solid; border-width: 0; transition: all 0.3s ease; }
    .corner-tl { top: 28px; left: 28px; border-top-width: 2px; border-left-width: 2px; }
    .corner-tr { top: 28px; right: 28px; border-top-width: 2px; border-right-width: 2px; }
    .corner-bl { bottom: 28px; left: 28px; border-bottom-width: 2px; border-left-width: 2px; }
    .corner-br { bottom: 28px; right: 28px; border-bottom-width: 2px; border-right-width: 2px; }
    .viewfinder-active .corner { border-color: #63caff; box-shadow: 0 0 15px rgba(99, 202, 255, 0.5); }

    #loading-screen { 
      position: fixed; inset: 0; background: #07070e; 
      display: flex; flex-direction: column; align-items: center; 
      justify-content: center; gap: 18px; z-index: 1000; 
    }
    .logo { font-size: 24px; font-weight: 700; color: #63caff; }
    .spinner { width: 48px; height: 48px; border: 3px solid rgba(99,202,255,0.15); border-top-color: #63caff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #instruction-container { position: fixed; bottom: 100px; width: 100%; display: flex; justify-content: center; z-index: 20; transition: opacity 0.3s ease; }
    .instruction-pill { background: rgba(15,15,15,0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); padding: 12px 24px; border-radius: 50px; }

    /* UNMUTE BUTTON */
    #unmute-btn { 
      position: fixed; top: 40px; left: 50%; transform: translateX(-50%); 
      z-index: 500; background: #63caff; color: #000; 
      border-radius: 50px; padding: 14px 28px; display: block; 
      cursor: pointer; border: none; font-family: inherit; font-weight: 700;
      box-shadow: 0 0 20px rgba(99, 202, 255, 0.6);
    }

    /* RECORD BUTTON */
    #record-btn {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 500; background: #ff4b2b; color: white;
      border-radius: 50px; padding: 14px 28px; cursor: pointer; border: none;
      font-family: inherit; font-weight: 700; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    #record-btn.recording { background: #000; border: 2px solid #ff4b2b; animation: pulse-red 1.5s infinite; }
    @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<div id="scan-line"></div>
<div id="loading-screen">
  <div class="logo">◈ Feel AR</div>
  <div class="spinner"></div>
</div>

<div id="viewfinder-layer">
  <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div><div class="corner corner-br"></div>
</div>

<div id="instruction-container">
  <div class="instruction-pill"><span>Point camera at the image</span></div>
</div>

<button id="unmute-btn">🔊 Click to Enable Sound</button>
<button id="record-btn">⏺ Start Recording</button>

<div id="scene-container"></div>

<script>
// --- CHROMA KEY COMPONENT ---
AFRAME.registerComponent('chromakey-video', {
  schema: {
    src: { type: 'selector' },
    color: { type: 'color', default: '#00FF00' },
    threshold: { type: 'number', default: 0.25 }
  },
  init: function () {
    const video = this.data.src;
    const videoTexture = new THREE.VideoTexture(video);
    videoTexture.format = THREE.RGBAFormat;
    const keyColor = new THREE.Color(this.data.color);
    this.material = new THREE.ShaderMaterial({
      uniforms: {
        tex: { value: videoTexture },
        keyColor: { value: new THREE.Vector3(keyColor.r, keyColor.g, keyColor.b) },
        threshold: { value: this.data.threshold }
      },
      vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform sampler2D tex; uniform vec3 keyColor; uniform float threshold; varying vec2 vUv;
        void main() {
          vec4 fColor = texture2D(tex, vUv);
          float d = distance(fColor.rgb, keyColor);
          if (d < threshold) { discard; } else { gl_FragColor = fColor; }
        }
      `,
      transparent: true
    });
    this.el.addEventListener('model-loaded', () => this.applyMaterial());
    this.applyMaterial();
  },
  applyMaterial: function() {
    const mesh = this.el.getObject3D('mesh');
    if (mesh) mesh.material = this.material;
  },
  tick: function () {
    if (this.material && this.material.uniforms.tex.value) {
      this.material.uniforms.tex.value.needsUpdate = true;
    }
  }
});

const GITHUB_USER = "logithkannan";
const GITHUB_REPO = "feel-ar-data";
const rawUrl = (path) => `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${path}?t=${Date.now()}`;
const projectId = new URLSearchParams(window.location.search).get("project");

let audioUnlocked = false;
let mediaRecorder;
let recordedChunks = [];

async function init() {
  if (!projectId) return;
  try {
    const res = await fetch(rawUrl(`projects/${projectId}.json`));
    const project = await res.json();
    buildScene(project);
    setupRecorder();
  } catch(e) { console.error(e); }
}

function buildScene(project) {
  const W = 500, H = 360;
  let assetsHTML = "";
  let entitiesHTML = "";

  project.layers.forEach((layer, i) => {
    const id = `layer-${i}`;
    const scaleW = (layer.width / W).toFixed(3);
    const scaleH = (layer.height / H).toFixed(3);
    const posX = (((layer.x + layer.width / 2) - W / 2) / W).toFixed(3);
    const posY = (-((layer.y + layer.height / 2) - H / 2) / H).toFixed(3);
    const rotZ = (-(layer.rotation || 0)).toFixed(1);

    if (layer.type === "video") {
      assetsHTML += `<video id="${id}-src" src="${layer.url}" loop="true" muted="true" playsinline crossorigin="anonymous" webkit-playsinline preload="auto"></video>`;
      entitiesHTML += `<a-plane id="${id}" width="${scaleW}" height="${scaleH}" position="${posX} ${posY} 0.01" rotation="0 0 ${rotZ}" chromakey-video="src: #${id}-src; threshold: 0.25" visible="false"></a-plane>`;
    } else if (layer.type === "image") {
      assetsHTML += `<img id="${id}-src" src="${layer.url}" crossorigin="anonymous" />`;
      entitiesHTML += `<a-image id="${id}" src="#${id}-src" width="${scaleW}" height="${scaleH}" position="${posX} ${posY} 0.01" rotation="0 0 ${rotZ}" material="shader: flat; transparent: true; opacity: ${layer.opacity || 1}" visible="false"></a-image>`;
    }
  });

  document.getElementById("scene-container").innerHTML = `
    <a-scene mindar-image="imageTargetSrc: ${project.mindFileUrl}; uiScanning: no; uiLoading: no;" vr-mode-ui="enabled: false" renderer="colorManagement: true; alpha: true; preserveDrawingBuffer: true;">
      <a-assets timeout="10000">${assetsHTML}</a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0" id="ar-target">${entitiesHTML}</a-entity>
    </a-scene>`;

  const scene = document.querySelector("a-scene");
  scene.addEventListener("renderstart", () => {
    setTimeout(() => { document.getElementById("loading-screen").style.display = "none"; }, 500);
  });

  const arTarget = document.getElementById("ar-target");
  arTarget.addEventListener("targetFound", () => {
    document.getElementById("scan-line").style.display = "none";
    document.getElementById("viewfinder-layer").classList.add("viewfinder-active");
    document.getElementById("instruction-container").style.opacity = "0";
    
    project.layers.forEach((layer, i) => {
      const el = document.getElementById(`layer-${i}`);
      if (el) el.setAttribute("visible", true);
      if (layer.type === "video") {
        const v = document.getElementById(`layer-${i}-src`);
        v.muted = !audioUnlocked;
        v.play().catch(() => {});
      }
    });
  });

  arTarget.addEventListener("targetLost", () => {
    document.getElementById("scan-line").style.display = "block";
    document.getElementById("viewfinder-layer").classList.remove("viewfinder-active");
    document.getElementById("instruction-container").style.opacity = "1";
    project.layers.forEach((layer, i) => {
      const el = document.getElementById(`layer-${i}`);
      if (el) el.setAttribute("visible", false);
      if (layer.type === "video") {
        const v = document.getElementById(`layer-${i}-src`);
        if (v) { v.pause(); v.currentTime = 0; }
      }
    });
  });

  document.getElementById("unmute-btn").addEventListener("click", function() {
    audioUnlocked = true;
    document.querySelectorAll('video').forEach(v => { v.muted = false; v.play().catch(()=>{}); });
    this.style.display = "none";
  });
}

// --- RECORDER LOGIC ---
function setupRecorder() {
  const recordBtn = document.getElementById("record-btn");
  recordBtn.addEventListener("click", () => {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
      recordBtn.textContent = "⏺ Start Recording";
      recordBtn.classList.remove("recording");
    } else {
      startRecording();
      recordBtn.textContent = "Stop & Save";
      recordBtn.classList.add("recording");
    }
  });
}

function startRecording() {
  const canvas = document.querySelector("canvas");
  const stream = canvas.captureStream(30);
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: "video/webm" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `FeelAR_${Date.now()}.webm`;
    a.click();
  };
  mediaRecorder.start();
}

init();
</script>
</body>
</html>
