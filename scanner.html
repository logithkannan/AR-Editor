<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Feel AR — Scanner</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    AFRAME.registerComponent('chromakey-video', {
      schema: {
        src:       { type: 'selector' },
        threshold: { type: 'number',   default: 0.25 },
        color:     { type: 'color',    default: '#00FF00' }
      },

      init: function () {
        const video = this.data.src;
        if (!video) return;

        const texture = new THREE.VideoTexture(video);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        this.chromaMaterial = new THREE.ShaderMaterial({
          transparent: true,
          depthWrite:  false,
          uniforms: {
            tex:      { value: texture },
            keyColor: { value: new THREE.Color(this.data.color) },
            threshold:{ value: this.data.threshold }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tex;
            uniform vec3      keyColor;
            uniform float     threshold;
            varying vec2      vUv;
            void main() {
              vec4  col  = texture2D(tex, vUv);
              float dist = distance(col.rgb, keyColor);
              if (dist < threshold) discard;
              gl_FragColor = col;
            }
          `
        });

        const applyMaterial = () => {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            mesh.material = this.chromaMaterial;
          } else {
            this.el.addEventListener('object3dset', () => {
              const m = this.el.getObject3D('mesh');
              if (m) m.material = this.chromaMaterial;
            }, { once: true });
          }
        };
        applyMaterial();

        video.play().catch(() => {
          document.body.addEventListener('click', () => video.play(), { once: true });
        });
      },

      update: function () {
        if (this.chromaMaterial) {
          this.chromaMaterial.uniforms.threshold.value = this.data.threshold;
          this.chromaMaterial.uniforms.keyColor.value.set(this.data.color);
        }
      },

      remove: function () {
        if (this.chromaMaterial) this.chromaMaterial.dispose();
      }
    });
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent !important; font-family: 'Outfit', sans-serif; color: white; }

    #scan-line {
      position: fixed; top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(to bottom, transparent, #63caff, transparent);
      box-shadow: 0 0 15px #63caff; z-index: 15;
      animation: scan 3s ease-in-out infinite; opacity: 0.6;
    }
    @keyframes scan { 0% { top: 15%; } 50% { top: 85%; } 100% { top: 15%; } }

    #viewfinder-layer { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .corner { position: absolute; width: 36px; height: 36px; border-color: rgba(255,255,255,0.3); border-style: solid; border-width: 0; transition: all 0.3s ease; }
    .corner-tl { top: 28px; left: 28px; border-top-width: 2px; border-left-width: 2px; }
    .corner-tr { top: 28px; right: 28px; border-top-width: 2px; border-right-width: 2px; }
    .corner-bl { bottom: 28px; left: 28px; border-bottom-width: 2px; border-left-width: 2px; }
    .corner-br { bottom: 28px; right: 28px; border-bottom-width: 2px; border-right-width: 2px; }
    .viewfinder-active .corner { border-color: #63caff; box-shadow: 0 0 15px rgba(99,202,255,0.5); }

    #scene-container { position: fixed; inset: 0; z-index: 1; }
    a-scene { width: 100% !important; height: 100% !important; }

    #loading-screen {
      position: fixed; inset: 0; background: #07070e;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; z-index: 100; text-align: center; padding: 24px;
    }
    .logo { font-size: 24px; font-weight: 700; color: #63caff; }
    .spinner { width: 48px; height: 48px; border: 3px solid rgba(99,202,255,0.15); border-top-color: #63caff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-status { font-size: 13px; color: rgba(255,255,255,0.45); font-weight: 300; }

    #error-screen {
      position: fixed; inset: 0; background: #07070e;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; z-index: 100; text-align: center; padding: 28px;
    }
    .err-icon { font-size: 52px; }
    .err-title { font-size: 20px; font-weight: 700; color: #f87171; }
    .err-msg { font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.8; max-width: 300px; }
    .retry-btn { background: #63caff; color: #07070e; border: none; padding: 12px 28px; border-radius: 30px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Outfit', sans-serif; }

    #instruction-container {
      position: fixed; bottom: 50px; width: 100%; display: flex; justify-content: center;
      pointer-events: none; z-index: 20; transition: opacity 0.3s ease;
    }
    .instruction-pill {
      background: rgba(15,15,15,0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1); padding: 12px 24px; border-radius: 50px;
      display: flex; align-items: center; gap: 10px;
    }
    .instruction-text { font-weight: 500; font-size: 1rem; }

    #target-indicator {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      z-index: 20; display: none;
      background: rgba(15,15,15,0.7); backdrop-filter: blur(12px);
      border: 1px solid rgba(99,202,255,0.25); border-radius: 30px;
      padding: 8px 18px; font-size: 12px; font-weight: 600; color: #63caff;
      gap: 8px; align-items: center;
    }
    .ti-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; }

    #unmute-btn {
      position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
      z-index: 500; background: #63caff; color: #000;
      border-radius: 50px; padding: 14px 28px; display: none;
      cursor: pointer; border: none; font-family: inherit; font-weight: 700;
      box-shadow: 0 0 20px rgba(99,202,255,0.6);
    }

    #fullscreen-btn {
      position: fixed; bottom: 52px; left: 50%; transform: translateX(-50%) scale(0); z-index: 500;
      width: 58px; height: 58px; border-radius: 50%; border: none; cursor: pointer;
      background: rgba(10,10,20,0.80); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 0 0 2px rgba(99,202,255,0.55), 0 0 22px rgba(99,202,255,0.35), inset 0 0 10px rgba(99,202,255,0.08);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease; pointer-events: none;
    }
    #fullscreen-btn::before {
      content: ''; position: absolute; inset: -6px; border-radius: 50%;
      border: 2px solid rgba(99,202,255,0.3); animation: pulse-ring 2s ease-out infinite; pointer-events: none;
    }
    @keyframes pulse-ring {
      0%   { transform: scale(1);    opacity: 0.7; }
      70%  { transform: scale(1.38); opacity: 0; }
      100% { transform: scale(1.38); opacity: 0; }
    }
    #fullscreen-btn.visible { transform: translateX(-50%) scale(1); pointer-events: auto; }
    #fullscreen-btn:active  { transform: translateX(-50%) scale(0.90) !important; }
    #fullscreen-btn svg { width: 22px; height: 22px; fill: none; stroke: #63caff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px rgba(99,202,255,0.7)); }
    #fullscreen-btn .fs-label {
      position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
      background: rgba(10,10,20,0.85); border: 1px solid rgba(99,202,255,0.25);
      color: #63caff; font-size: 10px; font-weight: 600; letter-spacing: 0.05em;
      white-space: nowrap; padding: 4px 10px; border-radius: 20px; pointer-events: none; opacity: 0;
    }
    #fullscreen-btn.visible .fs-label { animation: tooltip-fade 3s ease forwards; }
    @keyframes tooltip-fade { 0%{opacity:0} 15%{opacity:1} 75%{opacity:1} 100%{opacity:0} }

    #fs-player { position: fixed; inset: 0; z-index: 9999; background: #000; display: none; flex-direction: column; align-items: stretch; justify-content: center; }
    #fs-player.active { display: flex; }
    #fs-video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #fs-back-btn {
      position: absolute; top: 18px; left: 16px; z-index: 10000; display: flex; align-items: center; gap: 7px;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2); color: #fff; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600;
      padding: 9px 16px 9px 11px; border-radius: 50px; cursor: pointer; transition: background 0.2s, border-color 0.2s;
    }
    #fs-back-btn:active { background: rgba(99,202,255,0.2); border-color: #63caff; }
    #fs-back-btn svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>

<div id="scan-line"></div>

<div id="loading-screen">
  <div class="logo">◈ Feel AR</div>
  <div class="spinner"></div>
  <div class="load-status" id="load-status">Loading project...</div>
</div>

<div id="error-screen">
  <div class="err-icon">⚠️</div>
  <div class="err-title">Something went wrong</div>
  <div class="err-msg" id="error-msg">Unknown error</div>
  <button class="retry-btn" onclick="location.reload()">Try Again</button>
</div>

<div id="viewfinder-layer">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
</div>

<div id="target-indicator">
  <div class="ti-dot"></div>
  <span id="target-indicator-text">Target found</span>
</div>

<div id="instruction-container">
  <div class="instruction-pill">
    <span class="instruction-text" id="instruction-text">Point camera at the image</span>
  </div>
</div>

<button id="unmute-btn">🔊 Click to Enable Sound</button>

<button id="fullscreen-btn" aria-label="Watch full screen">
  <svg viewBox="0 0 24 24">
    <polyline points="15 3 21 3 21 9"/>
    <polyline points="9 21 3 21 3 15"/>
    <line x1="21" y1="3" x2="14" y2="10"/>
    <line x1="3"  y1="21" x2="10" y2="14"/>
  </svg>
  <span class="fs-label">Full Screen</span>
</button>

<div id="fs-player">
  <button id="fs-back-btn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </button>
  <video id="fs-video" playsinline webkit-playsinline controls loop></video>
</div>

<div id="scene-container"></div>

<script>
const GITHUB_USER = "logithkannan";
const GITHUB_REPO = "feel-ar-data";

const rawUrl = (path) =>
  `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${path}`;

const projectId = new URLSearchParams(window.location.search).get("project");

// FIXED: Cleaned up and optimized fetching method to robustly handle both Public/Private repos without CORS blocks
async function fetchProjectData(path) {
  try {
    // 1. Attempt standard Raw fetch (Fastest for public repositories)
    const response = await fetch(rawUrl(path), {
      headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
    });
    if (!response.ok) throw new Error("Raw file not available directly, switching to API route...");
    return await response.json();
  } catch (error) {
    console.log(error.message);
    const token = localStorage.getItem("feel_ar_token");
    const apiURL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`;
    
    // 2. Fetch file content properties from GitHub API to read the proper CORS-friendly download link
    const apiResponse = await fetch(apiURL, {
      headers: {
        ...(token ? { 'Authorization': `token ${token}` } : {}),
        'Cache-Control': 'no-cache'
      }
    });

    if (!apiResponse.ok) {
      throw new Error(`GitHub API returned error status: ${apiResponse.status}. Double check your token permissions.`);
    }

    const fileMeta = await apiResponse.json();
    
    // 3. Use standard Base64 decoding if the file is returned as a data blob, or fetch download_url directly
    if (fileMeta.download_url) {
      // Use the authorized dynamic download URL to cleanly read the JSON payload
      const finalRes = await fetch(fileMeta.download_url, {
        headers: token ? { 'Authorization': `token ${token}` } : {}
      });
      return await finalRes.json();
    } else if (fileMeta.content) {
      // fallback decoding mechanism
      const cleanBase64 = fileMeta.content.replace(/\s/g, '');
      const jsonText = atob(cleanBase64);
      return JSON.parse(jsonText);
    }
    
    throw new Error("Could not extract file properties from repo path configuration.");
  }
}

let audioUnlocked     = false;
let activeTargetCount = 0;
let activeVideoEl     = null;

function setStatus(msg) { document.getElementById("load-status").textContent = msg; }
function showError(msg) {
  document.getElementById("loading-screen").style.display = "none";
  document.getElementById("error-screen").style.display  = "flex";
  document.getElementById("error-msg").textContent = msg;
}

const unmuteBtn = document.getElementById("unmute-btn");
unmuteBtn.addEventListener("click", () => {
  audioUnlocked = true;
  document.querySelectorAll("video").forEach(v => { v.muted = false; v.play().catch(() => {}); });
  unmuteBtn.style.display = "none";
});

const fsBtn    = document.getElementById("fullscreen-btn");
const fsPlayer = document.getElementById("fs-player");
const fsVideo  = document.getElementById("fs-video");
const fsBack   = document.getElementById("fs-back-btn");

function showFsBtn(videoEl) { activeVideoEl = videoEl; fsBtn.classList.add("visible"); }
function hideFsBtn()        { activeVideoEl = null;    fsBtn.classList.remove("visible"); }

fsBtn.addEventListener("click", () => {
  if (!activeVideoEl) return;
  const src = activeVideoEl.currentSrc || activeVideoEl.src || activeVideoEl.getAttribute("src") || "";
  activeVideoEl.pause();
  fsVideo.src         = src;
  fsVideo.currentTime = activeVideoEl.currentTime || 0;
  fsVideo.muted       = false;
  fsVideo.loop        = true;
  fsPlayer.classList.add("active");
  fsVideo.play().catch(() => {});
});

fsBack.addEventListener("click", () => {
  const t = isFinite(fsVideo.currentTime) ? fsVideo.currentTime : 0;
  fsVideo.pause();
  fsVideo.removeAttribute("src");
  fsVideo.load();
  fsPlayer.classList.remove("active");
  if (activeVideoEl) {
    activeVideoEl.currentTime = t;
    activeVideoEl.muted = !audioUnlocked;
    activeVideoEl.play().catch(() => {});
  }
});

async function init() {
  if (!projectId) { showError("No project ID found in URL parameters. Please open this link using the preview links inside your project editor."); return; }
  setStatus("Loading project configurations...");
  let project;
  try {
    project = await fetchProjectData(`projects/${projectId}.json`);
  } catch (e) { 
    showError(e.message + " — Verify that the project ID is accurate and that your GitHub repo contains 'projects/" + projectId + ".json'."); 
    return; 
  }

  if (!project.mindFileUrl) { showError("No compiled AR target asset file map found. Generate and save target files in the editor before loading the scanner app."); return; }

  if (project.type === "multi") {
    if (!project.targets?.length) { showError("No image targets defined for this multi-layer canvas configuration."); return; }
    setStatus(`Building multi-target scene (${project.targets.length} targets)...`);
    buildMultiScene(project);
  } else {
    if (!project.layers?.length) { showError("No creative media layers applied to this target project profile."); return; }
    setStatus("Building AR scene...");
    buildSingleScene(project);
  }
}

function buildSingleScene(project) {
  const { assetsHTML, entitiesHTML } = buildTargetHTML(project.layers, 0);

  document.getElementById("scene-container").innerHTML = `
    <a-scene
      mindar-image="imageTargetSrc: ${project.mindFileUrl}; uiScanning: no; uiLoading: no;"
      vr-mode-ui="enabled: false"
      renderer="colorManagement: true; alpha: true;">
      <a-assets timeout="15000">${assetsHTML}</a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0" id="ar-target-0">
        ${entitiesHTML}
      </a-entity>
    </a-scene>`;

  const scene       = document.querySelector("a-scene");
  const arTarget    = document.getElementById("ar-target-0");
  const viewfinder  = document.getElementById("viewfinder-layer");
  const scanLine    = document.getElementById("scan-line");
  const instruction = document.getElementById("instruction-container");

  scene.addEventListener("renderstart", () => {
    setTimeout(() => { document.getElementById("loading-screen").style.display = "none"; }, 500);
  });

  arTarget.addEventListener("targetFound", () => {
    scanLine.style.display    = "none";
    viewfinder.classList.add("viewfinder-active");
    instruction.style.opacity = "0";
    showLayers(project.layers, 0);
    playVideos(project.layers, 0);
    const vid = getFirstVideoEl(project.layers, 0);
    if (vid) showFsBtn(vid);
  });

  arTarget.addEventListener("targetLost", () => {
    scanLine.style.display    = "block";
    viewfinder.classList.remove("viewfinder-active");
    instruction.style.opacity = "1";
    hideLayers(project.layers, 0);
    pauseVideos(project.layers, 0);
    hideFsBtn();
  });
}

function buildMultiScene(project) {
  let allAssetsHTML = "", allEntitiesHTML = "";

  project.targets.forEach((target, idx) => {
    const { assetsHTML, entitiesHTML } = buildTargetHTML(target.layers, idx);
    allAssetsHTML   += assetsHTML;
    allEntitiesHTML += `<a-entity mindar-image-target="targetIndex: ${idx}" id="ar-target-${idx}">${entitiesHTML}</a-entity>`;
  });

  document.getElementById("scene-container").innerHTML = `
    <a-scene
      mindar-image="imageTargetSrc: ${project.mindFileUrl}; uiScanning: no; uiLoading: no;"
      vr-mode-ui="enabled: false"
      renderer="colorManagement: true; alpha: true;">
      <a-assets timeout="15000">${allAssetsHTML}</a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      ${allEntitiesHTML}
    </a-scene>`;

  const scene         = document.querySelector("a-scene");
  const viewfinder    = document.getElementById("viewfinder-layer");
  const scanLine      = document.getElementById("scan-line");
  const instruction   = document.getElementById("instruction-container");
  const indicator     = document.getElementById("target-indicator");
  const indicatorText = document.getElementById("target-indicator-text");
  const instrText     = document.getElementById("instruction-text");

  instrText.textContent = `Point camera at any of ${project.targets.length} images`;

  scene.addEventListener("renderstart", () => {
    setTimeout(() => { document.getElementById("loading-screen").style.display = "none"; }, 500);
  });

  project.targets.forEach((target, idx) => {
    const arTarget = document.getElementById(`ar-target-${idx}`);

    arTarget.addEventListener("targetFound", () => {
      activeTargetCount++;
      scanLine.style.display    = "none";
      viewfinder.classList.add("viewfinder-active");
      instruction.style.opacity = "0";
      indicatorText.textContent = target.name || `Target ${idx}`;
      indicator.style.display   = "flex";
      showLayers(target.layers, idx);
      playVideos(target.layers, idx);
      const vid = getFirstVideoEl(target.layers, idx);
      if (vid) showFsBtn(vid);
    });

    arTarget.addEventListener("targetLost", () => {
      activeTargetCount = Math.max(0, activeTargetCount - 1);
      hideLayers(target.layers, idx);
      pauseVideos(target.layers, idx);
      if (activeTargetCount === 0) {
        scanLine.style.display    = "block";
        viewfinder.classList.remove("viewfinder-active");
        instruction.style.opacity = "1";
        indicator.style.display   = "none";
        hideFsBtn();
      }
    });
  });
}

const W = 500, H = 360;

function buildTargetHTML(layers, targetIdx) {
  let assetsHTML = "", entitiesHTML = "";

  (layers || []).forEach((layer, i) => {
    const id     = `t${targetIdx}-layer-${i}`;
    const scaleW = (layer.width  / W).toFixed(3);
    const scaleH = (layer.height / H).toFixed(3);
    const posX   = (((layer.x + layer.width  / 2) - W / 2) / W).toFixed(3);
    const posY   = (-((layer.y + layer.height / 2) - H / 2) / H).toFixed(3);
    const rotZ   = (-(layer.rotation || 0)).toFixed(1);
    const opac   = (layer.opacity ?? 1).toFixed(2);

    if (layer.type === "video") {
      assetsHTML += `<video id="${id}-src" src="${layer.url}" loop muted playsinline webkit-playsinline crossorigin="anonymous" preload="auto"></video>`;

      if (layer.isGreenScreen || layer.chromaKey) {
        const targetColor = layer.chromaColor || '#00FF00';
        
        let thresholdVal = 0.25;
        if (layer.chromaTolerance !== undefined) {
          thresholdVal = layer.chromaTolerance / 100;
        } else if (layer.chromaThreshold !== undefined) {
          thresholdVal = layer.chromaThreshold;
        }

        entitiesHTML += `<a-plane id="${id}"
          width="${scaleW}" height="${scaleH}"
          position="${posX} ${posY} 0.001"
          rotation="0 0 ${rotZ}"
          material="transparent: true; opacity: ${opac}"
          chromakey-video="src: #${id}-src; threshold: ${thresholdVal.toFixed(3)}; color: ${targetColor}"
          visible="false">
        </a-plane>`;
      } else {
        entitiesHTML += `<a-video id="${id}"
          src="#${id}-src"
          width="${scaleW}" height="${scaleH}"
          position="${posX} ${posY} 0.001"
          rotation="0 0 ${rotZ}"
          material="opacity: ${opac}; transparent: true; shader: flat; src: #${id}-src"
          visible="false">
        </a-video>`;
      }

    } else if (layer.type === "image") {
      assetsHTML   += `<img id="${id}-src" src="${layer.url}" crossorigin="anonymous" />`;
      entitiesHTML += `<a-image id="${id}"
        src="#${id}-src"
        width="${scaleW}" height="${scaleH}"
        position="${posX} ${posY} 0.001"
        rotation="0 0 ${rotZ}"
        material="opacity: ${opac}; transparent: true; shader: flat; src: #${id}-src"
        visible="false">
      </a-image>`;

    } else if (layer.type === "text") {
      const textWidth = ((layer.width / W) * 2).toFixed(3);
      const escaped   = (layer.content || "").replace(/"/g, "&quot;");
      entitiesHTML   += `<a-text id="${id}"
        value="${escaped}" align="center" color="white"
        width="${textWidth}"
        position="${posX} ${posY} 0.001"
        rotation="0 0 ${rotZ}"
        opacity="${opac}"
        visible="false">
      </a-text>`;
    }
  });

  return { assetsHTML, entitiesHTML };
}

function showLayers(layers, idx) {
  (layers || []).forEach((_, i) => {
    const el = document.getElementById(`t${idx}-layer-${i}`);
    if (el) el.setAttribute("visible", true);
  });
}
function hideLayers(layers, idx) {
  (layers || []).forEach((_, i) => {
    const el = document.getElementById(`t${idx}-layer-${i}`);
    if (el) el.setAttribute("visible", false);
  });
}

function playVideos(layers, idx) {
  (layers || []).forEach((layer, i) => {
    if (layer.type !== "video") return;
    const v = document.getElementById(`t${idx}-layer-${i}-src`);
    if (!v) return;
    v.muted = !audioUnlocked;
    v.play()
      .then(() => { if (!audioUnlocked) unmuteBtn.style.display = "block"; })
      .catch(() => { unmuteBtn.style.display = "block"; });
  });
}
function pauseVideos(layers, idx) {
  (layers || []).forEach((layer, i) => {
    if (layer.type !== "video") return;
    const v = document.getElementById(`t${idx}-layer-${i}-src`);
    if (v) { v.pause(); v.currentTime = 0; }
  });
}

function getFirstVideoEl(layers, idx) {
  for (let i = 0; i < (layers || []).length; i++) {
    if (layers[i].type === "video") {
      const v = document.getElementById(`t${idx}-layer-${i}-src`);
      if (v) return v;
    }
  }
  return null;
}

if (typeof DeviceOrientationEvent?.requestPermission === "function") {
  const req = () => {
    DeviceOrientationEvent.requestPermission()
      .then(r => { if (r === "granted") window.addEventListener("deviceorientation", () => {}); })
      .catch(console.error);
    document.removeEventListener("touchend", req);
  };
  document.addEventListener("touchend", req);
}

init();
</script>
</body>
</html>
