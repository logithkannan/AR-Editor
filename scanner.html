<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Feel AR Scanner</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body{
margin:0;
overflow:hidden;
background:#000;
font-family:sans-serif;
}

#loading{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#000;
color:white;
font-size:18px;
z-index:10;
}

#unmute{
position:fixed;
bottom:40px;
left:50%;
transform:translateX(-50%);
padding:10px 20px;
border-radius:30px;
border:none;
background:#ffffff;
color:#000;
font-weight:bold;
display:none;
z-index:20;
}
</style>
</head>

<body>

<div id="loading">Loading AR...</div>
<button id="unmute">🔊 Tap to Unmute</button>

<div id="scene-container"></div>

<script>

const GITHUB_USER="logithkannan"
const GITHUB_REPO="feel-ar-data"

const raw=(path)=>`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${path}?t=${Date.now()}`

const projectId=new URLSearchParams(location.search).get("project")

let audioUnlocked=false
let videos=[]

function unlockAudio(){
audioUnlocked=true
videos.forEach(v=>{
v.muted=false
v.play().catch(()=>{})
})
document.getElementById("unmute").style.display="none"
}

document.getElementById("unmute").onclick=unlockAudio
document.body.addEventListener("click",unlockAudio,{once:true})

async function init(){

if(!projectId){
alert("No project id")
return
}

let project

try{

const res=await fetch(raw(`projects/${projectId}.json`))
project=await res.json()

}catch(e){

alert("Failed to load project")
return

}

buildScene(project)

}

function buildScene(project){

let assets=""
let layers=""

project.layers.forEach((layer,i)=>{

const id=`layer-${i}`

const scaleW=(layer.width/500).toFixed(3)
const scaleH=(layer.height/360).toFixed(3)

const posX=(((layer.x+layer.width/2)-250)/500).toFixed(3)
const posY=(-((layer.y+layer.height/2)-180)/360).toFixed(3)

if(layer.type==="video"){

assets+=`
<video id="${id}-src"
src="${layer.url}"
loop
playsinline
webkit-playsinline
crossorigin="anonymous"
preload="auto">
</video>`

layers+=`
<a-video id="${id}"
src="#${id}-src"
width="${scaleW}"
height="${scaleH}"
position="${posX} ${posY} 0"
rotation="0 0 ${-(layer.rotation||0)}"
visible="false">
</a-video>`

}

if(layer.type==="image"){

assets+=`<img id="${id}-src" src="${layer.url}" crossorigin="anonymous">`

layers+=`
<a-image id="${id}"
src="#${id}-src"
width="${scaleW}"
height="${scaleH}"
position="${posX} ${posY} 0"
visible="false">
</a-image>`
}

})

document.getElementById("scene-container").innerHTML=`

<a-scene
mindar-image="imageTargetSrc:${project.mindFileUrl};uiScanning:no;uiLoading:no"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:true"
renderer="alpha:true">

<a-assets>

${assets}

</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0" id="target">

${layers}

</a-entity>

</a-scene>
`

const scene=document.querySelector("a-scene")

scene.addEventListener("loaded",()=>{

document.getElementById("loading").style.display="none"

const target=document.getElementById("target")

target.addEventListener("targetFound",()=>{

project.layers.forEach((layer,i)=>{

const el=document.getElementById(`layer-${i}`)
el.setAttribute("visible",true)

if(layer.type==="video"){

const vid=document.getElementById(`layer-${i}-src`)
videos.push(vid)

vid.muted=!audioUnlocked

vid.play()
.then(()=>{
if(!audioUnlocked){
document.getElementById("unmute").style.display="block"
}
})
.catch(()=>{
document.getElementById("unmute").style.display="block"
})

}

})

})

target.addEventListener("targetLost",()=>{

project.layers.forEach((layer,i)=>{

const el=document.getElementById(`layer-${i}`)
el.setAttribute("visible",false)

if(layer.type==="video"){

const vid=document.getElementById(`layer-${i}-src`)
vid.pause()
vid.currentTime=0

}

})

})

})

}

init()

</script>

</body>
</html>
