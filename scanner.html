<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Feel AR — Scanner</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    /* ... [Keep your existing CSS] ... */
  </style>
</head>
<body>

<div id="loading-screen">
  <div class="logo">◈ Feel AR</div>
  <div class="spinner"></div>
  <div id="load-status">Loading AR Experience...</div>
</div>

<div id="scene-container"></div>
<div id="video-sources" style="display:none"></div>

<script>
const params = new URLSearchParams(window.location.search);
const projectId = params.get("project");
let audioUnlocked = false;

async function init() {
  try {
    const res = await fetch(`https://raw.githubusercontent.com/logithkannan/feel-ar-data/main/projects/${projectId}.json`);
    const project = await res.json();
    setupScene(project);
  } catch (e) {
    console.error("Failed to load project", e);
  }
}

function setupScene(project) {
  const container = document.getElementById("scene-container");
  const videoSources = document.getElementById("video-sources");
  
  // Logic for Multi vs Single
  const targets = project.type === "multi" ? project.targets : [{ layers: project.layers }];
  const mindFile = project.mindFileUrl;

  let sceneHtml = `
    <a-scene mindar-image="imageTargetSrc: ${mindFile}; autoStart: true; uiScanning: #viewfinder-layer" 
             embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  `;

  targets.forEach((target, tIdx) => {
    sceneHtml += `<a-entity mindar-image-target="targetIndex: ${tIdx}" id="target-${tIdx}">`;
    
    target.layers.forEach((layer, lIdx) => {
      const id = `t${tIdx}-l${lIdx}`;
      
      if (layer.type === "video") {
        // Create unique video element for this specific target layer
        const v = document.createElement("video");
        v.id = `${id}-video`;
        v.src = layer.url;
        v.setAttribute("crossorigin", "anonymous");
        v.setAttribute("loop", "true");
        v.setAttribute("playsinline", "true");
        videoSources.appendChild(v);

        sceneHtml += `
          <a-video src="#${id}-video" 
            position="${layer.x} ${layer.y} 0.01" 
            scale="${layer.scale} ${layer.scale} 1"
            rotation="0 0 ${layer.rotation}"
            opacity="${layer.opacity}">
          </a-video>`;
      } else if (layer.type === "image") {
        sceneHtml += `
          <a-image src="${layer.url}" 
            position="${layer.x} ${layer.y} 0.01" 
            scale="${layer.scale} ${layer.scale} 1"
            rotation="0 0 ${layer.rotation}"
            transparent="true">
          </a-image>`;
      }
    });

    sceneHtml += `</a-entity>`;
  });

  sceneHtml += `</a-scene>`;
  container.innerHTML = sceneHtml;

  // Handle Play/Pause
  targets.forEach((_, tIdx) => {
    const el = document.getElementById(`target-${tIdx}`);
    el.addEventListener("targetFound", () => {
      document.querySelectorAll(`[id^='t${tIdx}-l']-video`).forEach(v => v.play());
    });
    el.addEventListener("targetLost", () => {
      document.querySelectorAll(`[id^='t${tIdx}-l']-video`).forEach(v => {
        v.pause();
        v.currentTime = 0;
      });
    });
  });

  document.getElementById("loading-screen").style.display = "none";
}

init();
</script>
</body>
</html>
